name: keep-system-live

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours — mirrors a real health-check interval
  workflow_dispatch: {}
  push:
    branches: [main]

jobs:
  contribution-snake:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: YOUR_USERNAME
          outputs: |
            assets/contribution-snake.svg
            assets/contribution-snake-dark.svg?palette=github-dark
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: regenerate contribution snake"
          file_pattern: "assets/contribution-snake*.svg"

  status-heartbeat:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: stamp last heartbeat into status-bar.svg
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%MZ")
          sed -i "s|last-heartbeat=\"[^\"]*\"|last-heartbeat=\"$TIMESTAMP\"|" assets/status-bar.svg || true
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: heartbeat"
          file_pattern: "assets/status-bar.svg"
