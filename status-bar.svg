<svg viewBox="0 0 960 64" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Courier New',monospace">
  <defs>
    <style>
      .bg { fill: #0A0E14; }
      .sep { stroke: #1C2333; stroke-width: 1; }
      .k { fill: #6B7684; font-size: 10px; letter-spacing: 0.5px; text-transform: uppercase; }
      .v { fill: #E6EDF3; font-size: 13px; font-weight: 600; }
      .ok { fill: #00D9A3; }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
      .live { animation: blink 1.8s ease-in-out infinite; }
    </style>
  </defs>
  <rect class="bg" width="960" height="64" rx="10"/>

  <circle class="ok live" cx="26" cy="32" r="5"/>
  <text x="42" y="26" class="k">status</text>
  <text x="42" y="42" class="v">all systems operational</text>

  <line class="sep" x1="230" y1="14" x2="230" y2="50"/>
  <text x="252" y="26" class="k">focus</text>
  <text x="252" y="42" class="v">distributed systems</text>

  <line class="sep" x1="460" y1="14" x2="460" y2="50"/>
  <text x="482" y="26" class="k">role</text>
  <text x="482" y="42" class="v">software engineering student</text>

  <line class="sep" x1="740" y1="14" x2="740" y2="50"/>
  <text x="762" y="26" class="k">region</text>
  <text x="762" y="42" class="v">building in public</text>
</svg>
