# ═══════════════════════════════════════════════════════════════════
# GitHub Metrics — Automated Dashboard Generator
# Runs daily at midnight UTC and on every push to main.
#
# SETUP REQUIRED:
#   1. Go to https://github.com/settings/tokens/new
#   2. Create a "Classic" Personal Access Token with scopes:
#        read:user, repo, read:packages
#   3. Go to your profile repo Settings → Secrets → Actions
#   4. Add a secret named: METRICS_TOKEN
#      with the token value you just created.
#
# After setup, this workflow will auto-generate:
#   - GitHub contribution calendar
#   - Commit activity by time of day
#   - Commit frequency per weekday
#   - Language activity breakdown
#   - Full metrics SVG embedded in README
# ═══════════════════════════════════════════════════════════════════

name: GitHub Metrics

on:
  schedule:
    # Runs daily at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  github-metrics:
    name: Generate GitHub Metrics
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Full Metrics Dashboard (Contribution Calendar + Activity) ──
      - name: Generate GitHub Metrics — Activity Dashboard
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: AntonyLukeP
          template: classic
          base: header, activity, community, repositories
          base_indepth: yes
          config_timezone: Asia/Kolkata
          config_output: svg
          filename: assets/metrics-activity.svg
          config_display: large
          config_padding: 10, 10
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_habits: yes
          plugin_habits_from: 365
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_charts_type: bar
          plugin_habits_trim: yes
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 365
          plugin_languages_recent_load: 300
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%
          plugin_repositories: no
          extras_css: |
            * { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
            :root { --color-background: #0d1117; }
            .header { background: #0d1117; }
