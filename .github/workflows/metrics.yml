# ═══════════════════════════════════════════════════════════════════
# GitHub Metrics — Engineering Dashboard Generator
#
# Generates:
#   assets/metrics-calendar.svg  — standard contribution calendar
#
# SETUP:
#   1. github.com/settings/tokens/new → Classic PAT
#      Scopes required: read:user, repo
#   2. Profile repo → Settings → Secrets → Actions
#      Secret name: METRICS_TOKEN
#
# Schedule: daily 00:00 UTC  |  manual dispatch  |  push to main
# ═══════════════════════════════════════════════════════════════════

name: GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  github-metrics:
    name: Generate GitHub Metrics
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Contribution Calendar SVG ──────────────────────────────────
      # Generates: assets/metrics-calendar.svg
      # Plugins: standard calendar (current year), coding habits,
      #          language breakdown
      # ──────────────────────────────────────────────────────────────
      - name: Generate Contribution Calendar & Activity Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: AntonyLukeP
          template: classic
          base: ""
          config_timezone: Asia/Kolkata
          config_output: svg
          filename: assets/metrics-calendar.svg
          config_display: large
          config_padding: 6, 10

          # Standard contribution calendar (current year)
          plugin_calendar: yes
          plugin_calendar_limit: 1

          # Coding habits — commit time-of-day chart
          plugin_habits: yes
          plugin_habits_from: 365
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_charts_type: bar
          plugin_habits_trim: yes

          # Language breakdown
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 365
          plugin_languages_recent_load: 300
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%
